<!DOCTYPE html>
<html>
<head>
    <title>@@TITLE@@</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --background-color: #ffffff;
            --text-color: #333333;
            --code-background: #f5f5f5;
            --blockquote-border: #ddd;
            --blockquote-color: #666;
            --link-color: #0366d6;
            --table-border: #ddd;
            --table-header-bg: #f2f2f2;
            --table-row-alt-bg: #f9f9f9;
            --base-font-size: 16px;
            --code-font-size: 0.99;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #1e1e1e;
                --text-color: #e0e0e0;
                --code-background: #2d2d2d;
                --blockquote-border: #555;
                --blockquote-color: #aaa;
                --link-color: #58a6ff;
                --table-border: #444;
                --table-header-bg: #2d2d2d;
                --table-row-alt-bg: #262626;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
            font-size: var(--base-font-size);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }

        .main-content.toc-visible {
            margin-left: 320px;
        }

        .bookmark-meta {
            margin-top: 40px;
            padding-top: 10px;
            border-top: 1px solid var(--table-border);
            color: var(--blockquote-color);
            font-size: 0.7em;
        }

        /* TOC Sidebar Styling */
        .toc-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background-color: var(--background-color);
            border-right: 1px solid var(--table-border);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .toc-sidebar.hidden {
            transform: translateX(-100%);
        }

        .toc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--table-border);
        }

        .toc-header h3 {
            margin: 0;
            font-size: 1.1em;
            font-weight: 600;
        }

        .toc-toggle {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            color: var(--text-color);
            padding: 5px;
            border-radius: 3px;
        }

        .toc-toggle:hover {
            background-color: var(--code-background);
        }

        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .toc-item {
            margin: 0;
            padding: 0;
        }

        .toc-link {
            display: block;
            padding: 6px 0;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 3px;
            transition: all 0.2s ease;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .toc-link:hover {
            background-color: var(--code-background);
            padding-left: 8px;
        }

        .toc-link.active {
            color: var(--link-color);
            background-color: var(--code-background);
            font-weight: 500;
        }

        .toc-h1 .toc-link {
            font-weight: 600;
            font-size: 0.95em;
        }

        .toc-h2 .toc-link {
            padding-left: 16px;
            font-size: 0.88em;
        }

        .toc-h3 .toc-link {
            padding-left: 32px;
            font-size: 0.85em;
            color: var(--blockquote-color);
        }

        .toc-mobile-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: var(--link-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Mobile responsive */
        @media (max-width: 1024px) {
            .main-content.toc-visible {
                margin-left: 0;
                padding: 20px;
            }

            .toc-sidebar {
                transform: translateX(-100%);
            }

            .toc-sidebar.mobile-visible {
                transform: translateX(0);
            }

            .toc-mobile-toggle {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 15px;
            }

            .toc-sidebar {
                width: 280px;
            }
        }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
        }

        h1 { font-size: 2em; border-bottom: 1px solid var(--table-border); padding-bottom: 0.3em; }
        h2 { font-size: 1.5em; border-bottom: 1px solid var(--table-border); padding-bottom: 0.3em; }

        a { color: var(--link-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Enhanced pre/code styling with syntax highlighting support */
        pre {
            background-color: var(--code-background);
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 16px 0;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: var(--code-font-size);
            line-height: 1.45;
        }

        code {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            background-color: var(--code-background);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: var(--code-font-size);
        }

        /* Inline code should be slightly larger for better readability */
        p code, li code, td code {
            font-size: calc(var(--code-font-size) * 1.05);
        }

        pre code {
            padding: 0;
            background-color: transparent;
            white-space: pre;
            word-break: normal;
            overflow-wrap: normal;
        }

        /* Syntax highlighting classes */
        .hljs-keyword { color: #cf222e; }
        .hljs-built_in { color: #e36209; }
        .hljs-type { color: #953800; }
        .hljs-literal { color: #0550ae; }
        .hljs-number { color: #0550ae; }
        .hljs-string { color: #0a3069; }
        .hljs-comment { color: #6e7781; }
        .hljs-doctag { color: #0550ae; }
        .hljs-meta { color: #8250df; }
        .hljs-function { color: #8250df; }

        @media (prefers-color-scheme: dark) {
            .hljs-keyword { color: #ff7b72; }
            .hljs-built_in { color: #ffa657; }
            .hljs-type { color: #ff7b72; }
            .hljs-literal { color: #79c0ff; }
            .hljs-number { color: #79c0ff; }
            .hljs-string { color: #a5d6ff; }
            .hljs-comment { color: #8b949e; }
            .hljs-doctag { color: #79c0ff; }
            .hljs-meta { color: #d2a8ff; }
            .hljs-function { color: #d2a8ff; }
        }

        /* Enhanced blockquote styling */
        blockquote {
            margin: 0;
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 1px;
            padding-top: 1px;
            background: rgba(0, 0, 0, 0.05);
            border-left: 4px solid var(--blockquote-border);
            color: var(--blockquote-color);
            margin-bottom: 16px;
        }

        @media (prefers-color-scheme: dark) {
            blockquote {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        /* Enhanced image styling */
        img {
            max-width: 100%;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin: 10px 0;
            border-radius: 4px;
        }

        /* Enhanced table styling with explicit font size control */
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
            overflow: auto;
            font-size: 1em; /* Match body font size */
        }

        th, td {
            border: 1px solid var(--table-border);
            padding: 8px 13px;
            text-align: left;
            font-size: 1em; /* Consistent font size */
            vertical-align: top;
        }

        th {
            background-color: var(--table-header-bg);
            font-weight: 600;
        }

        tr {
            font-size: 1em; /* Ensure rows maintain consistent font size */
        }

        tr:nth-child(even) {
            background-color: var(--table-row-alt-bg);
        }

        /* Lists styling */
        ul, ol {
            padding-left: 2em;
            margin-top: 0;
            margin-bottom: 16px;
        }

        li {
            margin-top: 0.25em;
        }

        /* Task lists */
        ul.contains-task-list {
            list-style-type: none;
            padding-left: 1em;
        }

        .task-list-item {
            position: relative;
            padding-left: 1.5em;
        }

        .task-list-item input {
            position: absolute;
            left: 0;
            top: 0.25em;
        }

        /* Smooth scrolling for anchor links */
        html {
            scroll-behavior: smooth;
        }

        /* Ensure headers have some top margin for anchor positioning */
        h1[id], h2[id], h3[id] {
            scroll-margin-top: 20px;
        }
    </style>
    <!-- MathJax for LaTeX rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
    <script type="text/x-mathjax-config">
        MathJax.Hub.Config({
            tex2jax: {
                inlineMath: [['$','$'], ['\\(','\\)']],
                displayMath: [['$$','$$'], ['\\[','\\]']],
                processEscapes: true
            }
        });
    </script>
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/sql.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightBlock(block);
            });

            // Add checkbox functionality for task lists
            document.querySelectorAll('.task-list-item input[type="checkbox"]').forEach(checkbox => {
                checkbox.disabled = false;
                checkbox.addEventListener('change', function() {
                    this.parentElement.classList.toggle('completed');
                });
            });

            // TOC functionality
            const tocSidebar = document.getElementById('toc-sidebar');
            const tocToggle = document.getElementById('toc-toggle');
            const tocMobileToggle = document.getElementById('toc-mobile-toggle');
            const mainContent = document.querySelector('.main-content');
            const tocLinks = document.querySelectorAll('.toc-link');

            // If TOC exists, add toc-visible class to main content
            if (tocSidebar) {
                mainContent.classList.add('toc-visible');
            }

            // Toggle TOC visibility
            function toggleToc() {
                if (window.innerWidth <= 1024) {
                    tocSidebar.classList.toggle('mobile-visible');
                } else {
                    tocSidebar.classList.toggle('hidden');
                    mainContent.classList.toggle('toc-visible');
                }
            }

            // Desktop toggle
            if (tocToggle) {
                tocToggle.addEventListener('click', toggleToc);
            }

            // Mobile toggle
            if (tocMobileToggle) {
                tocMobileToggle.addEventListener('click', toggleToc);
            }

            // Close mobile TOC when clicking on a link
            tocLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 1024) {
                        tocSidebar.classList.remove('mobile-visible');
                    }
                });
            });

            // Active section highlighting
            function updateActiveSection() {
                const headers = document.querySelectorAll('h1[id], h2[id], h3[id]');
                const scrollPosition = window.scrollY + 100;

                let activeId = null;
                for (const header of headers) {
                    if (header.offsetTop <= scrollPosition) {
                        activeId = header.id;
                    } else {
                        break;
                    }
                }

                // Update active link
                tocLinks.forEach(link => {
                    link.classList.remove('active');
                    if (activeId && link.getAttribute('href') === '#' + activeId) {
                        link.classList.add('active');
                    }
                });
            }

            // Update active section on scroll
            window.addEventListener('scroll', updateActiveSection);
            updateActiveSection(); // Initial call

            // Handle window resize
            window.addEventListener('resize', () => {
                if (window.innerWidth > 1024 && tocSidebar) {
                    tocSidebar.classList.remove('mobile-visible');
                    if (!tocSidebar.classList.contains('hidden')) {
                        mainContent.classList.add('toc-visible');
                    }
                } else {
                    tocSidebar.classList.remove('hidden');
                    mainContent.classList.remove('toc-visible');
                }
            });
        });
    </script>
</head>
<body>
    @@TOC@@
    <div class="container">
        <main class="main-content">
            @@BODY@@
            @@FOOTER@@
        </main>
    </div>
</body>
</html>
