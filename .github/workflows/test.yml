name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # L1 of TESTING.md: unit + integration tests, including LSP over stdio.
    # Scenario suites (make test-scenarios) need the embedding model and stay local.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bkmr
          # The automatic key has no OS version, but ort-sys build output stores the Xcode clang
          # path. Reusing it on another macOS image fails with: library 'clang_rt.osx' not found.
          # ponytail: an Xcode change within one image can still break this; bump prefix-key then.
          key: ${{ matrix.runner }}
      - name: make test
        run: make test
